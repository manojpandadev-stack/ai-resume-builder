version: '3.9'

services:

  mysql:
    image: mysql:8.4
    container_name: resume_mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: resume_db

    ports:
      - "3306:3306"

  app:
    build: .

    container_name: ai_resume_builder

    depends_on:
      - mysql

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/resume_db
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: your-secret-key
      JWT_EXPIRATION: 86400000